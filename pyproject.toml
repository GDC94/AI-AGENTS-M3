[project]
name = "orchestration"
version = "0.1.0"
description = "Multi-agent support routing for Atalaya Data: Router, Specialists, Judge, traced in Langfuse"
readme = "README.md"
authors = [
    { name = "German Derbes Catoni", email = "germanderbescatoni@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=4.17.0",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "--strict-markers -m 'not integration'"
markers = [
    "integration: calls real services (OpenAI, Langfuse); skipped when keys are absent",
]
